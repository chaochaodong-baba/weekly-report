<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的零成本周报</title>
    <!-- 引入 Vue3, Supabase, Docx -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f4f5; padding: 15px; max-width: 600px; margin: 0 auto; color: #333; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h3 { margin: 0 0 10px 0; font-size: 16px; color: #111; display: flex; align-items: center; justify-content: space-between; }
        textarea { width: 100%; border: 1px solid #eee; border-radius: 8px; padding: 10px; box-sizing: border-box; height: 80px; font-family: inherit; resize: none; }
        textarea:focus { outline: none; border-color: #3ecf8e; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; font-size: 14px; }
        .btn-send { background: #3ecf8e; }
        .btn-file { background: #333; }
        .btn-word { background: #ff9500; width: 100%; margin-top: 5px; }
        .loading { opacity: 0.6; pointer-events: none; }
        
        .list-item { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .list-item:last-child { border-bottom: none; }
        .time { font-size: 12px; color: #999; margin-bottom: 4px; display: block; }
        .content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        img { max-width: 100%; border-radius: 6px; margin-top: 6px; border: 1px solid #eee; }
        audio { width: 100%; margin-top: 6px; }
    </style>
</head>
<body>
    <div id="app">
        <!-- 输入区 -->
        <div class="card">
            <h3>📝 记录内容</h3>
            <textarea v-model="inputText" placeholder="写点什么..."></textarea>
            <div class="btn-group">
                <button class="btn-send" @click="sendText" :class="{loading: loading}">发送文字</button>
                <button class="btn-file" @click="triggerFile" :class="{loading: loading}">📷 图片 / 🎤 录音</button>
            </div>
            <input type="file" ref="fileInput" @change="handleFile" style="display: none;" accept="image/*,audio/*">
            <div v-if="loading" style="text-align:center; font-size:12px; color:#999; margin-top:5px;">正在处理...</div>
        </div>

        <!-- 导出按钮 -->
        <button class="btn-word" @click="generateWord">📤 一键生成周报 (Word)</button>

        <!-- 列表区 -->
        <div class="card" style="margin-top: 15px;">
            <h3>👀 实时同步列表 <span style="font-weight:normal; color:#999; font-size:12px;">保留近7天</span></h3>
            <div v-if="records.length === 0" style="text-align:center; padding:20px; color:#ccc;">暂无记录</div>
            <div v-for="item in records" :key="item.id" class="list-item">
                <span class="time">{{ formatTime(item.created_at) }}</span>
                <div v-if="item.type === 'text'" class="content">{{ item.content }}</div>
                <div v-if="item.type === 'image'"><img :src="item.content"></div>
                <div v-if="item.type === 'audio'"><audio controls :src="item.content"></audio></div>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = supabase;

        // ==========================================
        // 👇👇👇 请在这里填入你的 Key 👇👇👇
        // ==========================================
        const SUPABASE_URL = 'https://aampvlfsesvtzfnmvvbp.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_1_pxVl2u74y-orx9fQfadQ_PSl1HQar'; 
        // ==========================================

        const client = createClient(SUPABASE_URL, SUPABASE_KEY);

        Vue.createApp({
            data() { return { inputText: '', records: [], loading: false } },
            mounted() {
                this.loadRecords();
                this.initRealtime();
            },
            methods: {
                async loadRecords() {
                    const { data } = await client.from('records').select('*').order('created_at', { ascending: false });
                    if (data) this.records = data;
                },
                initRealtime() {
                    client.channel('public:records')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'records' }, payload => {
                            this.records.unshift(payload.new);
                        })
                        .subscribe();
                },
                async sendText() {
                    if (!this.inputText.trim()) return;
                    this.loading = true;
                    await client.from('records').insert({ type: 'text', content: this.inputText });
                    this.inputText = '';
                    this.loading = false;
                },
                triggerFile() { this.$refs.fileInput.click(); },
                async handleFile(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.loading = true;
                    try {
                        const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
                        const { error } = await client.storage.from('files').upload(fileName, file);
                        if (error) throw error;
                        
                        const { data } = client.storage.from('files').getPublicUrl(fileName);
                        
                        const type = file.type.startsWith('image') ? 'image' : 'audio';
                        await client.from('records').insert({ type, content: data.publicUrl });
                    } catch (err) { alert('上传失败: ' + err.message); } 
                    finally { this.loading = false; e.target.value = ''; }
                },
                async generateWord() {
                    const { Document, Packer, Paragraph, TextRun } = docx;
                    const children = [
                        new Paragraph({ children: [new TextRun({ text: "我的周报", bold: true, size: 40 })] }),
                        new Paragraph({ text: "------------------------" })
                    ];
                    this.records.forEach(item => {
                        children.push(new Paragraph({ children: [new TextRun({ text: `【${this.formatTime(item.created_at)}】`, bold: true, color: "888888" })] }));
                        if (item.type === 'text') children.push(new Paragraph({ text: item.content }));
                        else children.push(new Paragraph({ text: item.type === 'image' ? `[图片]: ${item.content}` : `[语音]: ${item.content}` }));
                        children.push(new Paragraph({ text: "" }));
                    });
                    const blob = await Packer.toBlob(new Document({ sections: [{ children }] }));
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = `周报_${new Date().toISOString().slice(0,10)}.docx`;
                    a.click();
                },
                formatTime(str) {
                    return new Date(str).toLocaleString('zh-CN', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
